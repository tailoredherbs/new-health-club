<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal — The New Health Club</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, serif; color: #1a1614; background: #fafaf8; line-height: 1.6; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; border-bottom: 1px solid #e8e6e1; position: sticky; top: 0; background: #fafaf8; z-index: 100; }
    .nav-logo { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: #1a1614; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: #5a5248; }
    .nav-links a:hover { color: #1a1614; }
    .nav-links a.active { color: #1a1614; border-bottom: 1px solid #1a1614; padding-bottom: 2px; }

    .article { max-width: 680px; margin: 0 auto; padding: 80px 48px 120px; }
    .back-link { font-size: 0.8rem; color: #7a7066; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 48px; }
    .back-link:hover { color: #1a1614; }
    .signal-meta { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    .signal-category { font-size: 0.6375rem; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7066; }
    .meta-dot { color: #c8c0b4; }
    .signal-location { font-size: 0.6375rem; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7066; }
    .signal-date { font-size: 0.75rem; color: #9a9088; margin-left: auto; }
    h1 { font-size: 2.25rem; font-weight: 400; line-height: 1.2; letter-spacing: -0.01em; margin-bottom: 32px; }
    .signal-divider { width: 40px; height: 1px; background: #c8c0b4; margin-bottom: 32px; }
    .signal-body p { font-size: 1rem; line-height: 1.85; color: #2a2420; margin-bottom: 24px; }
    .signal-tag-pill { display: inline-block; padding: 5px 12px; border: 1px solid #d4cfc5; font-size: 0.75rem; color: #5a5248; margin-top: 32px; }

    .signal-image { width: 100%; height: 360px; object-fit: cover; margin-bottom: 48px; display: block; }

    .article-footer { margin-top: 64px; padding-top: 32px; border-top: 1px solid #e8e6e1; display: flex; justify-content: space-between; align-items: center; }
    .back-to-signals { font-size: 0.8125rem; color: #1a1614; text-decoration: none; }
    .back-to-signals:hover { opacity: 0.6; }

    .footer-bar { background: #1a1614; padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; }
    .footer-copy { font-size: 0.75rem; color: #5a5248; letter-spacing: 0.06em; }
    .footer-nav { display: flex; gap: 24px; }
    .footer-nav a { font-size: 0.75rem; color: #5a5248; text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; }

    @media (max-width: 768px) {
      nav, .article, .footer-bar { padding-left: 24px; padding-right: 24px; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <nav class="sans">
    <a href="index.html" class="nav-logo">Social Wellness Clubs</a>
    <ul class="nav-links">
      <li><a href="map.html">Index</a></li>
      <li><a href="signals.html" class="active">Signals</a></li>
      <li><a href="reports.html">Reports</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="about.html#contact">Contact</a></li>
    </ul>
  </nav>

  <article class="article">
    <a href="signals.html" class="back-link sans">← Back to Signals</a>
    <div class="signal-meta sans">
      <span class="signal-category" id="signal-category"></span>
      <span class="meta-dot">·</span>
      <span class="signal-location" id="signal-location"></span>
      <span class="signal-date" id="signal-date"></span>
    </div>
    <h1 id="signal-title"></h1>
    <div class="signal-divider"></div>
    <img id="signal-image" class="signal-image" style="display:none;" alt="" />
    <div class="signal-body sans" id="signal-body"></div>
    <span class="signal-tag-pill sans" id="signal-tag"></span>
    <div class="article-footer">
      <a href="signals.html" class="back-to-signals sans">← All Signals</a>
    </div>
  </article>

  <footer class="footer-bar sans">
    <span class="footer-copy">© The New Health Club</span>
    <nav class="footer-nav">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
  </footer>

  <script src="https://unpkg.com/marked@9.0.0/marked.min.js"></script>
  <script>
    // Get signal ID from URL: signal.html?id=body-factory-property
    const params = new URLSearchParams(window.location.search);
    const signalId = params.get('id');

    if (signalId) {
      fetch(`_signals/${signalId}.md`)
        .then(r => r.text())
        .then(text => {
          // Parse frontmatter
          const fm = {};
          const fmMatch = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
          if (fmMatch) {
            fmMatch[1].split('\n').forEach(line => {
              const [key, ...val] = line.split(': ');
              if (key) fm[key.trim()] = val.join(': ').trim().replace(/^"|"$/g, '');
            });
            const body = fmMatch[2];
            document.title = `${fm.title} — The New Health Club`;
            document.getElementById('signal-category').textContent = fm.category || '';
            document.getElementById('signal-location').textContent = fm.location || '';
            document.getElementById('signal-date').textContent = fm.date ? new Date(fm.date).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
            document.getElementById('signal-title').textContent = fm.title || '';
            document.getElementById('signal-tag').textContent = fm.tag || '';
            document.getElementById('signal-body').innerHTML = marked.parse(body);
            if (fm.image) {
              const img = document.getElementById('signal-image');
              img.src = fm.image;
              img.style.display = 'block';
            }
          }
        })
        .catch(() => {
          document.getElementById('signal-title').textContent = 'Signal not found';
        });
    }
  </script>
</body>
</html>
