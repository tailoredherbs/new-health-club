backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "spaces"
    label: "Spaces (Index)"
    folder: "_spaces"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Area / City", name: "area", widget: "string", hint: "e.g. Canggu / Berawa, Mayfair / London" }
      - { label: "Region", name: "region", widget: "select", options: ["North America", "Europe", "Middle East", "Asia-Pacific", "Latin America", "Africa"] }
      - { label: "Category", name: "category", widget: "select", options: ["Longevity Sanctuaries", "Execution Hubs", "Practitioner-Led Boutiques", "Retreats", "Clubs"] }
      - { label: "Type", name: "primaryType", widget: "string", hint: "e.g. Recovery Club, Premium Gym, Longevity / Clinic, Wellness Resort" }
      - { label: "Status", name: "status", widget: "select", options: ["Mapped", "To verify", "Announced", "Closed"] }
      - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
      - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }
      - { label: "Best For", name: "bestFor", widget: "string", hint: "Comma-separated, e.g. Recovery, Longevity, Social Wellness" }
      - { label: "Tags", name: "tags", widget: "string", hint: "Comma-separated" }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false, hint: "e.g. @othership" }
      - { label: "Editorial Note", name: "body", widget: "markdown", hint: "1-3 sentences: what the venue is and why it matters" }

  - name: "signals"
    label: "Signals"
    folder: "_signals"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Opening", "Expansion", "Funding", "Partnership", "Product Launch", "Real Estate", "Leadership Move", "Other"] }
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Bali, Indonesia" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "MMM D, YYYY", time_format: false }
      - { label: "Tag", name: "tag", widget: "string", hint: "e.g. Real Estate, Recovery Clubs" }
      - { label: "Short Description", name: "description", widget: "text", hint: "1-2 sentences shown in the list view" }
      - { label: "Full Body", name: "body", widget: "markdown", hint: "Full signal content - 1 to 3 paragraphs" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }

  - name: "reports"
    label: "Reports"
    folder: "_reports"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Type", name: "type", widget: "select", options: ["Category Brief", "Market Report", "Operator Analysis", "City Focus", "Special Briefing"] }
      - { label: "Date", name: "date", widget: "datetime", date_format: "MMM D, YYYY", time_format: false }
      - { label: "Tag", name: "tag", widget: "string", hint: "e.g. Real Estate, Recovery Clubs" }
      - { label: "Short Description", name: "description", widget: "text", hint: "2-3 sentences shown in the list view" }
      - { label: "Full Body", name: "body", widget: "markdown" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
