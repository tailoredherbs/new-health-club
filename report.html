<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report — The New Health Clubs</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="canonical" href="https://thenewhealthclubs.com/reports" />
  <meta property="og:url" content="https://thenewhealthclubs.com/reports" />
  <meta property="og:site_name" content="The New Health Clubs" />
  <meta property="og:title" content="Report — The New Health Clubs" />
  <meta property="og:image" content="https://thenewhealthclubs.com/new-health-club-hero-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Lora', Georgia, serif; color: #1a1614; background: #fafaf8; line-height: 1.6; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; border-bottom: 1px solid #e8e6e1; position: sticky; top: 0; background: #fafaf8; z-index: 100; }
    .nav-logo { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: #1a1614; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: #5a5248; }
    .nav-links a:hover { color: #1a1614; }
    .nav-links a.active { color: #1a1614; border-bottom: 1px solid #1a1614; padding-bottom: 2px; }

    /* ARTICLE LAYOUT */
    .article-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 80px; max-width: 1100px; margin: 0 auto; padding: 64px 48px 120px; }

    /* MAIN CONTENT */
    .article-back { font-size: 0.8rem; color: #7a7066; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 48px; }
    .article-back:hover { color: #1a1614; }
    .article-tag { font-size: 0.6375rem; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7066; margin-bottom: 16px; }
    .article-title { font-size: 2.5rem; font-weight: 400; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 24px; }
    .article-divider { width: 40px; height: 1px; background: #c8c0b4; margin-bottom: 24px; }
    .article-meta { display: flex; gap: 20px; font-size: 0.8rem; color: #9a9088; margin-bottom: 48px; flex-wrap: wrap; }
    .article-meta span { display: flex; align-items: center; gap: 6px; }
    .article-desc { font-size: 1.0625rem; line-height: 1.8; color: #3a3630; margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid #e8e6e1; font-style: italic; }
    .article-body p { font-size: 1rem; line-height: 1.85; color: #1a1614; margin-bottom: 24px; }
    .article-body h2 { font-size: 1.5rem; font-weight: 400; margin: 40px 0 16px; }
    .article-body h3 { font-size: 1.125rem; font-weight: 500; margin: 32px 0 12px; }
    .article-body strong { font-weight: 500; }
    .article-body em { font-style: italic; color: #5a5248; }

    /* SIDEBAR */
    .sidebar { padding-top: 72px; }
    .sidebar-block { margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid #e8e6e1; }
    .sidebar-block:last-child { border-bottom: none; }
    .sidebar-label { font-size: 0.6375rem; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7066; margin-bottom: 12px; }
    .sidebar-value { font-size: 0.875rem; color: #1a1614; line-height: 1.6; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-pill { font-size: 0.72rem; padding: 4px 10px; border: 1px solid #d4cfc5; color: #5a5248; border-radius: 2px; }
    .sidebar-nav a { display: block; font-size: 0.8375rem; color: #1a1614; text-decoration: none; padding: 10px 0; border-bottom: 1px solid #f0ede8; }
    .sidebar-nav a:hover { opacity: 0.6; }
    .sidebar-nav a:last-child { border-bottom: none; }

    .footer-bar { background: #1a1614; padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; }
    .footer-copy { font-size: 0.75rem; color: #5a5248; }
    .footer-nav { display: flex; gap: 24px; }
    .footer-nav a { font-size: 0.75rem; color: #5a5248; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em; }

    @media (max-width: 900px) {
      .article-wrap { grid-template-columns: 1fr; gap: 48px; padding: 40px 24px 80px; }
      nav, .footer-bar { padding-left: 24px; padding-right: 24px; }
      .sidebar { padding-top: 0; border-top: 1px solid #e8e6e1; padding-top: 40px; }
      .article-title { font-size: 1.875rem; }
    }
  </style>
</head>
<body>
  <nav class="sans">
    <a href="index.html" class="nav-logo">The New Health Clubs</a>
    <ul class="nav-links">
      <li><a href="map.html">Index</a></li>
      <li><a href="signals.html">Signals</a></li>
      <li><a href="reports.html" class="active">Reports</a></li>
      <li><a href="access.html">Access</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div class="article-wrap">
    <main>
      <a href="reports.html" class="article-back sans">← Back to Reports</a>
      <div class="article-tag sans" id="report-type"></div>
      <h1 class="article-title" id="report-title"></h1>
      <div class="article-divider"></div>
      <div class="article-meta sans" id="report-meta"></div>
      <div class="article-desc sans" id="report-desc"></div>
      <div class="article-body" id="report-body"></div>
    </main>

    <aside class="sidebar sans">
      <div class="sidebar-block">
        <div class="sidebar-label">Category</div>
        <div class="sidebar-value" id="sb-type"></div>
      </div>
      <div class="sidebar-block">
        <div class="sidebar-label">Theme</div>
        <div class="sidebar-value" id="sb-theme"></div>
      </div>

      <div class="sidebar-block">
        <div class="sidebar-label">Tags</div>
        <div class="tag-list" id="sb-tags"></div>
      </div>
      <div class="sidebar-block">
        <div class="sidebar-label">More Reports</div>
        <div class="sidebar-nav" id="sb-more"></div>
      </div>
    </aside>
  </div>

  <footer class="footer-bar sans">
    <span class="footer-copy">© The New Health Clubs · The New Health Clubs is operated by New Health Access.</span>
    <nav class="footer-nav">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
  </footer>

  <script src="https://unpkg.com/marked@9.0.0/marked.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const reportId = params.get('id');

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str);
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function parseFrontmatter(text) {
      const fm = {};
      const match = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (match) {
        const lines = match[1].split('\n');
        let currentKey = null, currentVal = [];
        lines.forEach(line => {
          const keyMatch = line.match(/^([a-zA-Z_]+):\s?"?(.*?)"?\s*$/);
          if (keyMatch) {
            if (currentKey) fm[currentKey] = currentVal.join(' ').trim().replace(/^"|"$/g, '');
            currentKey = keyMatch[1].trim();
            currentVal = [keyMatch[2].trim()];
          } else if (currentKey && line.trim()) {
            currentVal.push(line.trim());
          }
        });
        if (currentKey) fm[currentKey] = currentVal.join(' ').trim().replace(/^"|"$/g, '');
        fm.body = match[2].trim();
      }
      return fm;
    }

    if (reportId) {
      fetch('/reports-data.json')
        .then(r => r.json())
        .then(reports => {
          const fm = reports.find(r => r.id === reportId);
          if (!fm) {
            document.getElementById('report-title').textContent = 'Report not found';
            return;
          }
          document.title = `${fm.title} — The New Health Clubs`;
          document.getElementById('report-type').textContent = fm.type || '';
          document.getElementById('report-title').textContent = fm.title || '';
          document.getElementById('report-meta').innerHTML = `
            <span>${formatDate(fm.date)}</span>
            
            
          `;
          document.getElementById('report-desc').textContent = fm.description || '';
          document.getElementById('report-body').innerHTML = marked.parse(fm.body || '');
          document.getElementById('sb-type').textContent = fm.type || '';
          document.getElementById('sb-theme').textContent = fm.theme || '';
          
          if (fm.tag) {
            document.getElementById('sb-tags').innerHTML = fm.tag.split(',')
              .map(t => `<span class="tag-pill">${t.trim()}</span>`).join('');
          }
        });

      // Load more reports for sidebar
      fetch('/reports-data.json')
        .then(r => r.json())
        .then(reports => {
          const others = reports.filter(r => r.id !== reportId).slice(0, 4);
          document.getElementById('sb-more').innerHTML = others.length
            ? others.map(r => `<a href="report.html?id=${r.id}">${r.title}</a>`).join('')
            : '<span style="color:#9a9088;font-size:0.8rem;">More reports coming soon.</span>';
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
