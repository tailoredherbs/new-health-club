  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Lora', Georgia, serif; color: #1a1614; background: #fafaf8; line-height: 1.6; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; border-bottom: 1px solid #e8e6e1; position: sticky; top: 0; background: #fafaf8; z-index: 100; }
    .nav-logo { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: #1a1614; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: #5a5248; }
    .nav-links a:hover { color: #1a1614; }
    .nav-links a.active { color: #1a1614; border-bottom: 1px solid #1a1614; padding-bottom: 2px; }

    .reports-hero { width: 100%; }
    .reports-hero-img { width: 100%; height: auto; display: block; }

    .filter-tabs { padding: 0 48px; border-bottom: 1px solid #e8e6e1; display: flex; justify-content: space-between; align-items: center; }
    .tabs-left { display: flex; overflow-x: auto; }
    .filter-tab { padding: 14px 18px; font-size: 0.8rem; color: #7a7066; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; background: none; border-left: none; border-right: none; border-top: none; transition: all 0.15s; font-family: inherit; }
    .filter-tab:hover { color: #1a1614; }
    .filter-tab.active { color: #1a1614; border-bottom-color: #1a1614; }

    .reports-section { max-width: 1000px; margin: 0 auto; padding: 0 48px 100px; }
    .report-row { display: grid; grid-template-columns: 1fr auto; gap: 32px; padding: 36px 0; border-bottom: 1px solid #e8e6e1; text-decoration: none; color: inherit; transition: opacity 0.2s; align-items: center; }
    .report-row:hover { opacity: 0.65; }
    .report-type { font-size: 0.6375rem; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7066; margin-bottom: 10px; }
    .report-title { font-size: 1.375rem; font-weight: 400; line-height: 1.3; margin-bottom: 12px; }
    .report-desc { font-size: 0.875rem; line-height: 1.65; color: #5a5248; margin-bottom: 14px; max-width: 600px; }
    .report-footer { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .report-meta { font-size: 0.75rem; color: #9a9088; }
    .report-tag { font-size: 0.7rem; padding: 4px 10px; border: 1px solid #d4cfc5; color: #5a5248; border-radius: 2px; }
    .report-arrow { font-size: 1.25rem; color: #c8c0b4; flex-shrink: 0; }

    .empty-state { padding: 80px 0; text-align: center; color: #9a9088; font-size: 0.9rem; line-height: 1.8; }

    .footer-bar { background: #1a1614; padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; }
    .footer-copy { font-size: 0.75rem; color: #5a5248; }
    .footer-nav { display: flex; gap: 24px; }
    .footer-nav a { font-size: 0.75rem; color: #5a5248; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em; }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .hero-right { display: none; }
      nav, .hero-left, .filter-tabs, .reports-section, .footer-bar { padding-left: 24px; padding-right: 24px; }
      .report-row { grid-template-columns: 1fr; }
      .report-arrow { display: none; }
    }
  </style>

  <div class="filter-tabs sans">
    <div class="tabs-left">
      <button class="filter-tab active" data-type="All">All Reports</button>
      <button class="filter-tab" data-type="Report">Reports</button>
      <button class="filter-tab" data-type="Category Brief">Category Briefs</button>
      <button class="filter-tab" data-type="Operator Analysis">Operator Analyses</button>
      <button class="filter-tab" data-type="City Focus">City Focus</button>
      <button class="filter-tab" data-type="Special Briefing">Special Briefings</button>
    </div>
  </div>

  <section class="reports-section">
    <div id="reports-list"><div class="empty-state sans">Loading reports...</div></div>
  </section>

  <footer class="footer-bar sans">
    <span class="footer-copy">© The New Health Clubs</span>
    <nav class="footer-nav">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="about.html#contact">Contact</a>
    </nav>
  </footer>

  <script>
    let allReports = [];
    let activeType = 'All';

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str);
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function renderReports() {
      const filtered = allReports.filter(r =>
        activeType === 'All' || r.type === activeType
      );
      const list = document.getElementById('reports-list');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state sans"><p>Reports coming soon.</p><p style="font-size:0.8rem;margin-top:8px;">The first reports are being prepared.</p></div>';
        return;
      }
      list.innerHTML = filtered.map(r => `
        <a href="report.html?id=${r.id}" class="report-row">
          <div>
            <div class="report-type sans">${r.type || ''}</div>
            <div class="report-title">${r.title}</div>
            <div class="report-desc sans">${r.description || ''}</div>
            <div class="report-footer sans">
              <span class="report-meta">${formatDate(r.date)}</span>
              ${r.tag ? r.tag.split(',').slice(0,2).map(t => `<span class="report-tag">${t.trim()}</span>`).join('') : ''}
            </div>
          </div>
          <div class="report-arrow">→</div>
        </a>
      `).join('');
    }

    fetch('/reports-data.json')
      .then(r => r.json())
      .then(data => {
        allReports = data;
        renderReports();
      })
      .catch(() => {
        document.getElementById('reports-list').innerHTML = '<div class="empty-state sans">Reports coming soon.</div>';
      });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeType = tab.dataset.type;
        renderReports();
      });
    });
  </script>
