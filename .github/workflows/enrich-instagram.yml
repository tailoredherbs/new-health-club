name: Enrich Instagram handles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run enrichment
        run: python3 enrich_instagram.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _spaces/
          git diff --cached --quiet && echo "No changes" || git commit -m "Add Instagram handles to spaces (automated)"
          git push
